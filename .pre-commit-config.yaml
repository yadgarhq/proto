# Every yadgarhq repo carries pre-commit (D59). Hook failure is signal, not
# obstacle: fix the cause and re-stage. Never --no-verify.
#
# This is the CONTRACT repo, so it carries the baseline plus buf. A Rust module
# repo swaps the buf block for the cargo one — see D59 for the full baseline.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      # PARSE GATES. A file a parser cannot load at all still passes any check
      # that reads it as text and regexes it — which is how a malformed compose
      # file once kept every version gate green in the predecessor repo.
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # Shared, from yadgarhq/actions (D62) — this was a near-identical local block
  # in every repository until the shared definition existed.
  # IMMUTABLE rev, unlike the @v1 the workflow caller pins. pre-commit caches a
  # rev at first install and never re-resolves it — "mutable references are never
  # updated after first install and are not supported" — so a moving tag here
  # would silently freeze each machine at whatever v1 meant the day it first ran.
  # GitHub Actions re-resolves @v1 every run; pre-commit does not. Bump with
  # `pre-commit autoupdate`.

  - repo: https://github.com/yadgarhq/actions
    rev: v1.2.0
    hooks:
      - id: gitleaks
      - id: prettier
      # No Containerfile here yet; the hook is a no-op until one arrives, which is
      # cheaper than remembering to add it on the day it does.
      - id: hadolint

  - repo: https://github.com/bufbuild/buf
    rev: v1.72.0
    hooks:
      # Canonical formatting. Rewrites files, so a first run fails the commit
      # and you re-stage — the same shape as terraform_fmt.
      - id: buf-format
      # STANDARD lint: directory layout mirrors the package path, services carry
      # the Service suffix.
      - id: buf-lint
      # D15's additive-only rule, enforced at commit time rather than only in
      # CI. Local git, so it costs nothing — and a break caught here never
      # reaches a branch someone else has pulled.
      #
      # TWO INVOCATIONS, AND NEITHER ONE IS THE GATE ON ITS OWN. This was one
      # hook, against v1.0.0 only, and that half was silently vacuous for every
      # file added after the first tag.
      #
      #   v1.0.0 — the major's first tag (D15). A change is additive-only
      #     *within a major*, so v1 must stay compatible with v1.0.0 forever,
      #     not merely with whatever shipped last. Comparing against the latest
      #     tag alone would let the contract drift away from v1.0.0 one
      #     compatible step at a time. Bump this only when a v2 exists, to that
      #     major's first tag.
      #
      #   the previous tag — D16, verbatim: "`buf breaking` runs in CI against
      #     the previous tag and rejects any breaking change." v1.0.0 contains
      #     NONE of iam, iamdb, telemetry, ask or taskapi, so for those five
      #     files the first-tag comparison has nothing to compare against and
      #     passes on an empty set. A renumbered field in any of them exits 0
      #     against v1.0.0 and 100 against v1.5.0 — verified by injecting one.
      #
      # THE SECOND PIN IS BUMPED AT EVERY RELEASE, and the hook below is what
      # says so — the version appears once, in its args, and nowhere else. A
      # stale pin is not merely conservative: it still compares the files that
      # existed at that tag, but anything added AFTER it and then broken slips
      # through, which is the exact class this second invocation exists to
      # catch.
      - id: buf-breaking
        alias: buf-breaking-major
        name: buf breaking (v1.0.0, the major's first tag)
        args: [--against, .git#tag=v1.0.0]
      - id: buf-breaking
        alias: buf-breaking-previous
        name: buf breaking (the previous tag)
        args: [--against, .git#tag=v1.6.0]

  # THE PIN ABOVE IS THE ONE THING IN THIS FILE THAT GOES STALE, and a stale one
  # fails SILENTLY — it keeps comparing the files that existed at that tag while
  # everything added since goes ungated. A comment asking a releaser to remember
  # is the same discipline that left the first pin standing alone since v1.0.0,
  # so the obligation is a hook instead. It reads the pin out of this file and
  # compares it with the newest tag reachable from HEAD: the first commit after
  # a release fails until the pin is bumped, and the message says what to write.
  #
  # IT DOES NOT RUN buf, deliberately. Resolving the tag at run time and handing
  # it to `buf breaking` would need buf, and the hooks above are
  # `language: golang` — pre-commit builds buf into an isolated environment and
  # it is NOT on PATH, in CI or on a developer's machine. A local hook would
  # have to pin the buf version a second time to get one, which trades this
  # staleness for another. `sh` and `git` are always there.
  #
  # IT READS THE NEWEST TAG REACHABLE FROM HEAD, which on the default branch is
  # the newest tag there is and on a branch cut before a release is not. Such a
  # branch is asked for the pin IT can see — an older tag, narrowing the gate
  # rather than widening it. Rebase on the default branch before writing what it
  # asks for.
  #
  # NO TAG REACHABLE FROM HEAD — a fresh repository, or a clone deep enough for
  # history and shallow on tags — SKIPS rather than fails. The precommit job
  # checks out at `fetch-depth: 0` precisely because `buf breaking` needs the
  # tags, so a skip there would mean the tags are genuinely absent.
  - repo: local
    hooks:
      - id: buf-breaking-pin-is-current
        name: buf breaking pins the previous tag
        language: system
        pass_filenames: false
        always_run: true
        entry: sh -c 'latest=$(git describe --tags --abbrev=0 2>/dev/null) || exit 0; pinned=$(grep -A2 buf-breaking-previous .pre-commit-config.yaml | sed -n "s/.*\.git#tag=\(v[0-9][0-9.]*\).*/\1/p"); [ "$latest" = "$pinned" ] && exit 0; echo "buf breaking is pinned against ${pinned:-nothing} but the newest tag reachable from HEAD is $latest."; echo "Set the buf-breaking-previous args in .pre-commit-config.yaml to .git#tag=$latest."; exit 1'
