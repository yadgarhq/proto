// The canonical tag vocabulary (D51). Four modules tag — memory, wiki, task,
// agent-prompt — so the vocabulary cannot live inside any one of them. Each
// calls ResolveTags on its own write path; a contract test per module asserts
// an unknown tag comes back PROPOSED, because the omission is otherwise silent.
syntax = "proto3";

package yadgar.tag.v1;

import "yadgar/common/v1/common.proto";

enum TagStatus {
  TAG_STATUS_UNSPECIFIED = 0;
  // In the vocabulary. Use freely.
  TAG_STATUS_CANONICAL = 1;
  // Matched nothing and was accepted anyway. A D31 curation signal, never a
  // rejection: an agent that cannot express a distinction encodes it in the
  // content instead, where nothing indexes it.
  TAG_STATUS_PROPOSED = 2;
  // Resolves to canonical_urn. A merge rewrites this table, never the records,
  // so it stays reversible.
  TAG_STATUS_ALIAS = 3;
  TAG_STATUS_RETIRED = 4;
}

message Tag {
  yadgar.common.v1.Meta meta = 1;

  string name = 16;
  TagStatus status = 17;
  // Set when status == ALIAS. The tag this one resolves to.
  string canonical_urn = 18;
  uint64 usage_count = 19;
}

message ResolvedTag {
  // Exactly as the caller supplied it. Records keep what they were written
  // with; resolution happens on read through the alias table.
  string submitted = 1;
  string canonical = 2;
  TagStatus status = 3;
  // Set when an alias was followed, so a caller can report the substitution.
  bool substituted = 4;
}

// Batch by construction. A record carries several tags and a per-tag rpc would
// make every write an N+1 across the network — the risk D5's coarse-API rule
// exists to prevent.
message ResolveTagsRequest {
  yadgar.common.v1.Scope scope = 1;
  repeated string tags = 2;
  // False rejects unknown tags instead of marking them PROPOSED. For a caller
  // validating before a write; never the default.
  bool allow_propose = 3;
}
message ResolveTagsResponse {
  repeated ResolvedTag tags = 1;
}

message ListTagsRequest {
  yadgar.common.v1.Scope scope = 1;
  optional TagStatus status = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListTagsResponse {
  repeated Tag tags = 1;
  string next_page_token = 2;
}

// Curator operations. Ordinary writers only ever resolve (D51).
message PromoteTagRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
}
message PromoteTagResponse {
  yadgar.common.v1.Meta meta = 1;
}

message AliasTagRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  string canonical_urn = 4;
  uint64 expect_version = 5;
}
message AliasTagResponse {
  yadgar.common.v1.Meta meta = 1;
}

message RetireTagRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
}
message RetireTagResponse {
  yadgar.common.v1.Meta meta = 1;
}

service TagDbService {
  rpc ResolveTags(ResolveTagsRequest) returns (ResolveTagsResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc PromoteTag(PromoteTagRequest) returns (PromoteTagResponse);
  rpc AliasTag(AliasTagRequest) returns (AliasTagResponse);
  rpc RetireTag(RetireTagRequest) returns (RetireTagResponse);
}
