syntax = "proto3";

package yadgar.wiki.v1;

import "google/protobuf/field_mask.proto";
import "yadgar/common/v1/common.proto";

message WikiPage {
  yadgar.common.v1.Meta meta = 1;

  // Display name. NOT an identifier and NOT unique — ten pages may share one
  // (D42). The corpus is kept clean by the three-scope dedup and surprise gate
  // (D41), not by a uniqueness constraint, which never caught "deploy-notes" vs
  // "deploy_notes" anyway. Name -> URN resolution is an INDEX on this column with
  // a covering select, never a second table.
  string name = 16;
  string title = 17;
  string content = 18;
  string category = 19;
  repeated string tags = 20;

  // Outbound [[slug]] references, stored as URNs. A module owns only its own
  // outbound edges; reverse lookup is a fanout (O4).
  repeated string links = 21;
}

message CreateWikiPageRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  WikiPage page = 3;
}
message CreateWikiPageResponse {
  yadgar.common.v1.Meta meta = 1;
}

message UpdateWikiPageRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
  WikiPage page = 5;
  google.protobuf.FieldMask update_mask = 6;
}
message UpdateWikiPageResponse {
  yadgar.common.v1.Meta meta = 1;
}

// Addressed by URN only. There is no by-name arm: a name is not unique (D42), so
// a by-name get would have to pick one of several matches. Named entry points are
// bookmarks, which map a stable name to a URN per scope (D41).
message GetWikiPageRequest {
  yadgar.common.v1.Scope scope = 1;
  string id = 2;
}
message GetWikiPageResponse {
  WikiPage page = 1;
}

message BatchGetWikiPagesRequest {
  yadgar.common.v1.Scope scope = 1;
  repeated string ids = 2;
}
message BatchGetWikiPagesResponse {
  // A REQUESTED ID THAT MATCHES NOTHING IS OMITTED, and the response is still
  // `Ok`. Absence is the negative answer: no such page, none visible at this
  // scope, or soft-deleted (D26) — deliberately indistinguishable, because an
  // answer that told them apart would report the existence of a record the
  // caller may not see. An empty list is a valid answer, not an error.
  //
  // WHAT THE CONSUMER OWES: MATCH BY `meta.id`, NEVER BY POSITION. This list is
  // SPARSE and carries NO ORDER GUARANTEE — it is shorter than `ids` whenever
  // anything is missing — so index-aligned iteration pairs the wrong id with the
  // wrong page and reports it as success. That is a live hazard here: a batch of
  // URNs is how a link fan-out is resolved, so the mistake renders one page's
  // body under another page's link. Nothing about it fails to compile, which is
  // why the rule is stated on the message a consumer receives rather than left
  // to be noticed (ADR-0512). A caller that needs to know WHICH ids were missing
  // subtracts what came back from what it asked for.
  repeated WikiPage pages = 1;
}

message DeleteWikiPageRequest {
  yadgar.common.v1.Idempotency idempotency = 1;
  yadgar.common.v1.Scope scope = 2;
  string id = 3;
  uint64 expect_version = 4;
}
message DeleteWikiPageResponse {}

service WikiDbService {
  rpc CreateWikiPage(CreateWikiPageRequest) returns (CreateWikiPageResponse);
  rpc UpdateWikiPage(UpdateWikiPageRequest) returns (UpdateWikiPageResponse);
  rpc GetWikiPage(GetWikiPageRequest) returns (GetWikiPageResponse);
  rpc BatchGetWikiPages(BatchGetWikiPagesRequest) returns (BatchGetWikiPagesResponse);
  rpc DeleteWikiPage(DeleteWikiPageRequest) returns (DeleteWikiPageResponse);
}
