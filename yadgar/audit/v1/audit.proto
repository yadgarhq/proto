// Audit is append-only and therefore exempt from the CAS envelope: no version,
// no deleted_at, no updates (D25). A deletion is recorded by appending a
// tombstone event, never by rewriting a row.
syntax = "proto3";

package yadgar.audit.v1;

import "google/protobuf/timestamp.proto";
import "yadgar/common/v1/common.proto";

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_CREATE = 1;
  ACTION_UPDATE = 2;
  ACTION_DELETE = 3;
  ACTION_SHARE = 4; // visibility widened
  ACTION_UNSHARE = 5; // visibility narrowed
  ACTION_READ = 6; // read stream only
}

// Written to an outbox table in the SAME transaction as the change it
// describes, then relayed to the broker. A crash between commit and publish
// leaves the event in the outbox, so no write event is ever lost. Delivery is
// at-least-once; consumers must be idempotent.
message WriteEvent {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;

  // ATTESTED, AND THAT IS WHAT SEPARATES IT FROM THE FIELD BELOW. It is filled
  // in from `yadgar.common.v1.Scope`, which the gateway populates from the
  // request's credentials and which a caller cannot supply — so a reader of
  // this field is reading an identity something checked.
  //
  // THE IDENTITY MODULE'S ADMINISTRATIVE PATH IS THE ONE EXCEPTION AND IT DOES
  // NOT USE THIS FIELD. Those RPCs carry no `Scope`, deliberately (ADR-0488),
  // so nothing on that path is attested at the boundary that records the event.
  // They attribute through `unverified_actor` instead.
  //
  // PRESENCE OF `unverified_actor` IS THE DISCRIMINATOR, NEVER AN EMPTY STRING
  // HERE. A reader asks whether that message is present; it never infers the
  // answer from this field being empty, because "unattributed" and "attributed
  // to the empty id" would then be one value again — the collapse ADR-0512
  // records.
  string actor_user_id = 3;
  optional string actor_agent = 4;

  // WHO THE GATEWAY BELIEVED WAS CALLING, WHERE NOTHING AT THIS BOUNDARY COULD
  // VERIFY IT. Set on the identity module's administrative path and nowhere
  // else today. What may be done with it is stated once, on
  // yadgar.common.v1.UnverifiedActor: reported as unverified, and nothing else.
  //
  // **IT IS A SEPARATE FIELD FROM `actor_user_id` RATHER THAN A SOURCE FOR IT,
  // AND THAT IS THE WHOLE POINT.** Every other module attributes from an
  // attested `Scope`, so `actor_user_id` means "this is who it was". Writing an
  // unverifiable value into that same field would SPLIT ITS MEANING SILENTLY,
  // and a later reader — an incident review, an auditor, a regulator — would
  // have no way to tell which of the two they were holding. That is the exact
  // failure this pair exists to prevent: an audit record is opened long after
  // everyone who knew how it was written has gone, and it must say what it
  // knows AND what it does not.
  //
  // AT MOST ONE OF THE TWO IS SET ON ANY EVENT.
  yadgar.common.v1.UnverifiedActor unverified_actor = 13;

  Action action = 5;
  string target_urn = 6;

  // THE PROJECT THE CHANGED ENTITY BELONGS TO, AND EMPTY ON AN ADMINISTRATIVE
  // EVENT. The identity module's administrative acts — creating a user,
  // promoting an administrator, adding a team member — belong to no project, so
  // there is nothing to put here and the empty string is the whole of what is
  // known.
  //
  // **THE EMPTY VALUE OF THIS FIELD IS NOT A PATH, SO NO SUBTREE CONTAINS IT.**
  // `QueryAuditRequest.scope.project_id` is the subtree being queried, matching
  // that path and everything beneath it. An empty value here names no path and
  // lies beneath none, so no scope matches it. AN ADMINISTRATIVE EVENT IS
  // THEREFORE UNREACHABLE BY A SCOPED QUERY, before any actor filter is
  // consulted at all.
  //
  // THAT DECIDES WHAT THIS EVENT FIELD HOLDS AND WHAT MATCHES IT, AND NOTHING
  // ABOUT `yadgar.common.v1.Scope`. What an empty value in a QUERY's scope
  // means is that message's to state, and a second normative copy here would be
  // the one that drifts.
  //
  // STATED RATHER THAN LEFT UNDEFINED, BECAUSE THE TWO READINGS FAIL IN
  // OPPOSITE DIRECTIONS AND BOTH FAIL QUIETLY. An implementor reading empty as
  // "matches everything" leaks every administrative act in the deployment into
  // every project-scoped query; one reading it as a literal project id matches
  // a project whose id is empty and finds nothing. Reaching these events takes
  // a query-side field that asks for administrative events rather than a scope,
  // which is additive and is not added here.
  //
  // A CONSUMER NEVER INFERS THE ADMINISTRATIVE PATH FROM THIS FIELD BEING
  // EMPTY. Presence of `unverified_actor` is the discriminator, here as for
  // `actor_user_id` above.
  string project_id = 7;
  optional string team_id = 8;

  // Visibility transition, set on SHARE / UNSHARE.
  optional yadgar.common.v1.Visibility from_visibility = 9;
  optional yadgar.common.v1.Visibility to_visibility = 10;

  // Field names only. Audit references identifiers, never content.
  repeated string changed_fields = 11;

  uint64 result_version = 12;
}

// Published directly to the broker, fire-and-forget, never blocking the
// response. A read has no write transaction to attach an outbox row to, so the
// exactly-with-the-change guarantee is structurally unavailable here: read
// auditing is best-effort and may be sampled. A gap in this stream is NOT
// evidence that a read did not happen.
message ReadEvent {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  // ATTESTED, on the same terms as WriteEvent.actor_user_id above — and with
  // the same one exception, which reaches a READ too. The identity module's
  // `ListCredentials` is administrative (D72) and carries no `Scope`, so it
  // attributes through `unverified_actor` below. The write half of this defect
  // and the read half are one defect, so they get one shape.
  string actor_user_id = 3;
  optional string actor_agent = 4;

  // WHO THE GATEWAY BELIEVED WAS CALLING. See WriteEvent.unverified_actor for
  // why this is a field of its own and not a source for the one above, and
  // yadgar.common.v1.UnverifiedActor for what may be done with it.
  //
  // A GAP IN THIS STREAM WAS ALREADY NOT EVIDENCE THAT A READ DID NOT HAPPEN,
  // and this field does not change that. Read auditing is best-effort and may
  // be sampled, so an unverifiable attribution on a stream that may be missing
  // entries is weaker still. It is recorded because it is the only evidence
  // there is, never because it is good evidence.
  yadgar.common.v1.UnverifiedActor unverified_actor = 8;

  repeated string target_urns = 5;
  string project_id = 6;
  // The rpc that served the read, e.g. "yadgar.recall.v1.RecallService/Recall".
  string via = 7;
}

message QueryAuditRequest {
  yadgar.common.v1.Scope scope = 1;
  optional string target_urn = 2;
  optional string actor_user_id = 3;
  optional google.protobuf.Timestamp since = 4;
  optional google.protobuf.Timestamp until = 5;
  int32 page_size = 6;
  string page_token = 7;
}
message QueryAuditResponse {
  repeated WriteEvent write_events = 1;
  repeated ReadEvent read_events = 2;
  string next_page_token = 3;
}

// Writes are retained permanently by default with configurable retention;
// reads are rotated on a window. The two are stored separately so a
// high-volume rotating dataset and a permanent one do not share reclamation.
service AuditDbService {
  rpc QueryAudit(QueryAuditRequest) returns (QueryAuditResponse);
}
